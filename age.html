<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - CalcEasy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <a href="index.html" class="logo">Calc<span>Easy</span></a>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<main class="calculator-page">

    <a href="index.html" class="back">← Back to calculators</a>

    <div class="calculator-box">

        <div class="big-icon">🎂</div>

        <h1>Age Calculator</h1>
        <p>Enter your birthday to calculate your age.</p>

        <label>Date of Birth</label>
        <input type="date" id="birthday">

        <button onclick="calculateAge()">Calculate Age</button>

        <div class="result" id="result">
            Your age will appear here
        </div>

    </div>

</main>

<script>
function calculateAge() {

    const input = document.getElementById("birthday").value;

    if (!input) {
        document.getElementById("result").textContent =
            "Please select your birthday.";
        return;
    }

    const birth = new Date(input + "T00:00:00");
    const today = new Date();

    let age = today.getFullYear() - birth.getFullYear();

    const month = today.getMonth() - birth.getMonth();

    if (
        month < 0 ||
        (month === 0 && today.getDate() < birth.getDate())
    ) {
        age--;
    }

    document.getElementById("result").textContent =
        "You are " + age + " years old.";
}
</script>

</body>
</html>
