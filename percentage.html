```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator - CalcEasy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <a href="index.html" class="logo">Calc<span>Easy</span></a>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<main class="calculator-page">

    <a href="index.html" class="back">← Back to calculators</a>

    <div class="calculator-box">

        <div class="big-icon">%</div>

        <h1>Percentage Calculator</h1>
        <p>Calculate a percentage of any number.</p>

        <label>Number</label>
        <input type="number" id="number" placeholder="e.g. 500">

        <label>Percentage</label>
        <input type="number" id="percent" placeholder="e.g. 20">

        <button onclick="calculate()">Calculate</button>

        <div class="result" id="result">
            Your result will appear here
        </div>

    </div>

</main>

<script>
function calculate() {
    const number = Number(document.getElementById("number").value);
    const percent = Number(document.getElementById("percent").value);

    if (!number && number !== 0 || !percent && percent !== 0) {
        document.getElementById("result").textContent =
            "Please enter both numbers.";
        return;
    }

    const result = number * percent / 100;

    document.getElementById("result").textContent =
        percent + "% of " + number + " = " + result;
}
</script>

</body>
</html>
